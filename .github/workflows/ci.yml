# Pipeline de CI (ADR-010, docs/09 §9.6). E2E e Lighthouse entram junto com os testes E2E; o deploy
# é feito pelo Render (render.yaml, autoDeployTrigger: checksPass).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Formatação, lint e typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck
      # docs/openapi.json versionado precisa corresponder às rotas (docs/05)
      - run: pnpm openapi:check

  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm turbo run test
      - name: Publicar cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: |
            apps/web/coverage/
            packages/*/coverage/
          if-no-files-found: ignore

  integration:
    name: Integração e cobertura do backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Testcontainers usa o Docker já disponível no runner. A cobertura do backend soma
      # unitários e integração numa só execução (docs/09 §9.5).
      - run: pnpm turbo run test:coverage
      - name: Publicar cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: apps/api/coverage/
          if-no-files-found: ignore

  security:
    name: Auditoria e segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Auditoria de dependências
        run: pnpm audit --audit-level=high
      - name: Varredura de segredos (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose

  versions:
    name: Commits e versões
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # merge-base com origin/main
      - uses: ./.github/actions/setup
      # O bump depende do tipo do commit: mensagem fora do padrão falha aqui em vez de virar
      # "sem bump" (cobre commits feitos sem o hook commit-msg). Commits de merge são ignorados.
      # Também aplica o limite de arquivos por commit (cobre commits feitos sem o pre-commit).
      - name: Validar mensagens e tamanho dos commits
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            FROM=$(git merge-base origin/main "$TO")
          fi
          pnpm exec commitlint --from "$FROM" --to "$TO" --verbose
          node scripts/check-commit-size.js --range "$FROM..$TO"
      # Garante o bump único em relação à main mesmo para commits feitos sem os hooks
      - run: node scripts/bump-versions.js --check

  build:
    name: Build
    needs: [quality, test, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build

  docker:
    name: Imagem Docker
    needs: [quality, test, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build da imagem
        run: docker compose build
      - name: Subir o Compose
        run: docker compose up -d
      - name: Smoke test
        run: |
          curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://localhost:3000/api/health/ready
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
      - name: Logs
        if: ${{ failure() }}
        run: docker compose logs
      - name: Derrubar o Compose
        if: ${{ always() }}
        run: docker compose down -v

  # Check único para a proteção da main e para o deploy do Render (autoDeployTrigger: checksPass)
  ok:
    name: CI ok
    if: ${{ always() }}
    needs: [quality, test, integration, security, versions, build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verificar jobs
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1

# Stack do E2E (docs/09 §9.3): `pnpm e2e:up`, ou
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
# Cada cenário cadastra um usuário em 4 projetos de navegador: o limite de cadastro e login por IP
# (10/min por padrão) seria atingido e a API responderia 429.
services:
  api:
    environment:
      AUTH_IP_RATE_LIMIT: 1000

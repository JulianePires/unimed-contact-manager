x-app: &app
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: agenda-unimed:local
  init: true
  environment: &app-env
    NODE_ENV: production
    # Credenciais fora da URL: o pg lê PGUSER/PGPASSWORD/PGDATABASE sem exigir percent-encoding
    DATABASE_URL: postgres://postgres:5432/
    PGUSER: ${POSTGRES_USER:-contatos}
    PGPASSWORD: ${POSTGRES_PASSWORD:-contatos}
    PGDATABASE: ${POSTGRES_DB:-contatos}
    LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contatos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contatos}
      POSTGRES_DB: ${POSTGRES_DB:-contatos}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    <<: *app
    command: ['node', 'dist/migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      WORKER_MODE: standalone
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sid}
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health/ready']
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ['node', 'dist/worker.js']
    environment:
      <<: *app-env
      WORKER_MODE: standalone
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:

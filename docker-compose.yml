services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: contatos
      POSTGRES_PASSWORD: contatos
      POSTGRES_DB: contatos
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contatos -d contatos']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:

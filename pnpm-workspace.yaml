packages:
  - 'apps/*'
  - 'packages/*'

# Pacotes autorizados a executar scripts de instalação (postinstall etc.).
# Adicione somente o necessário (ex.: esbuild, argon2) — ADR-011.
onlyBuiltDependencies:
  - argon2
  - esbuild

# Scripts recusados de propósito (dependências do Testcontainers): cpu-features é um acelerador
# nativo opcional do ssh2 e o script do protobufjs só verifica versão.
ignoredBuiltDependencies:
  - cpu-features
  - protobufjs
  - ssh2

peerDependencyRules:
  allowedVersions:
    # jsx-a11y 6.10.2 declara peer até ESLint 9, mas funciona no 10 (verificado). ADR-011.
    eslint-plugin-jsx-a11y>eslint: '10'

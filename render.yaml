# Blueprint do Render (docs/03 §3.6, ADR-010). Variante FREE ativa: um Web Service e o Postgres free,
# com migrations na inicialização sob advisory lock. A variante paga está comentada abaixo.
#
# ATENÇÃO: o Postgres free expira 30 dias após a criação e os dados são apagados. Antes disso, faça
# upgrade do plano (`plan: 0.1c-256mb` ou maior) ou exporte os dados com pg_dump (README › Deploy).
databases:
  - name: agenda-unimed-db
    plan: free
    region: virginia
    databaseName: contatos
    user: contatos
    postgresMajorVersion: '18'
    # Só a rede interna do Render. Para inspecionar com psql, libere seu IP público temporariamente:
    #   ipAllowList:
    #     - source: 203.0.113.4/32
    #       description: inspeção manual
    ipAllowList: []

services:
  - type: web
    name: agenda-unimed
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    autoDeployTrigger: checksPass
    preDeployCommand: node dist/migrate.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agenda-unimed-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: WORKER_MODE
        value: standalone
      - key: MIGRATE_ON_BOOT
        value: 'false'
      - key: SESSION_COOKIE_NAME
        value: __Host-sid
      - key: LOG_LEVEL
        value: info

  - type: worker
    name: agenda-unimed-worker
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agenda-unimed-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: WORKER_MODE
        value: standalone
      - key: LOG_LEVEL
        value: info
